name: Daily Job Market Tracker

on:
  schedule:
    # Runs daily at 2:30 AM UTC (8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome Dependencies (for Puppeteer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libasound2 libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Install Node Packages
        run: npm ci

      - name: Run Job Tracker Script
        run: node tracker.js

      - name: Commit & Push Updated JSON Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add job_matches.json
          git commit -m "auto: daily job market update" || exit 0
          git push
